<div class="container mt-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fp-bold text-primary">🛍️Running Orders</h2>

    <div class="d-flex gap-2">
      <!-- Wishlist Button -->
      <button class="btn btn-outline-secondary position-relative" (click)="toggleWishlist()">
        ❤️ Wishlist
        <span class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-pill">
          {{ wishlist.length }}
        </span>
      </button>

      <!-- Cart Button -->
      <button class="btn btn-outline-primary position-relative" (click)="toggleCart()">
        🛒 Cart
        <span class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-pill">
          {{ cart.length }}
        </span>
      </button>
    </div>
  </div>

  <div class="row">
    <!-- Filters Sidebar -->
    <div class="col-md-3">
      <div class="bg-light border rounded p-3 shadow-sm mb-4">
        <h5 class="fw-bold mb-3 text-dark">🔍 Filter Products</h5>

        <div class="mb-3">
          <label class="form-label text-muted">Search</label>
          <input type="text" [(ngModel)]="searchQuery" class="form-control" placeholder="Search..." />
        </div>

        <div class="mb-3">
          <label class="form-label text-muted">Category</label>
          <select class="form-select" [(ngModel)]="selectedCategory">
            <option value="">All</option>
            <option *ngFor="let cat of categories">{{ cat }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted">Shipping Mode</label>
          <div class="form-check" *ngFor="let mode of ['', 'Air', 'Sea']">
            <input class="form-check-input" type="radio" name="shippingMode" [value]="mode" [(ngModel)]="shippingMode" />
            <label class="form-check-label text-muted">
              {{ mode === '' ? 'Any' : (mode === 'Air' ? '✈️ Air' : '🚢 Sea') }}
            </label>
          </div>
        </div>
      </div>

      <!-- Running Orders -->
      <div class="bg-white border-start border-4 border-warning p-3 rounded shadow-sm">
        <h6 class="fw-bold text-dark mb-2">📦 Current Batch: JAN/001</h6>
        <p class="mb-1 text-muted">Closes in: <span class="fw-semibold text-danger">3 days</span></p>
        <p class="mb-2 text-muted">ETA: <span class="text-primary">Jan 30</span></p>
        <button class="btn btn-sm btn-outline-warning w-100">Join This Batch</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="col-md-9">
      <div class="row g-4">
        <div *ngFor="let product of filteredProducts()" class="col-12 col-sm-6 col-lg-4">
          <div class="card h-100 border-0 shadow-sm">
            <img [src]="product.image" class="card-img-top rounded-top" alt="{{ product.name }}" style="height: 200px; object-fit: cover;" />
            <div class="card-body d-flex flex-column">
              <h5 class="fw-semibold text-dark">{{ product.name }}</h5>
              <span *ngIf="product.tag" class="badge bg-primary-subtle text-primary-emphasis mb-2">{{ product.tag }}</span>
              <p class="small text-muted mb-2">{{ product.description }}</p>

              <p class="mb-2 text-dark">
                <strong class="text-primary">${{ product.price }}</strong>
                <span class="ms-2 small text-muted">| {{ product.shippingMode }}</span>
              </p>
              <p class="small text-muted">💬 Ordered by <strong>{{ product.demand }}</strong> others</p>

              <div class="mt-auto">
                <button class="btn btn-sm btn-primary w-100 mb-2" (click)="addToCart(product)">
                  ➕ Add to Cart
                </button>
                <button class="btn btn-sm btn-outline-danger w-100" (click)="addToWishlist(product)">
                  ❤️ Save for Later
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebars -->
  <app-cart-sidebar
    *ngIf="showCart"
    [cart]="cart"
    [isOpen]="showCart"
    (close)="toggleCart()"
    (remove)="removeFromCart($event)">
  </app-cart-sidebar>

  <app-wishlist-sidebar
    *ngIf="showWishlist"
    [wishlist]="wishlist"
    [isOpen]="showWishlist"
    (close)="toggleWishlist()"
    (remove)="removeFromWishlist($event)">
  </app-wishlist-sidebar>
</div>
