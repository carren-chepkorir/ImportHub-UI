<div class="bg-light p-3 rounded shadow-sm mb-4">
  <h6 class="fw-bold mb-3">Filters</h6>
  <div class="mb-3">
    <label class="form-label">Search</label>
    <input type="text" class="form-control" [(ngModel)]="searchQuery" (ngModelChange)="searchChange.emit($event)" />
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select class="form-select" [(ngModel)]="selectedCategory" (ngModelChange)="categoryChange.emit($event)">
      <option value="">All</option>
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Shipping Mode</label>
    <div class="form-check">
      <input type="radio" name="mode" class="form-check-input" value="" [(ngModel)]="shippingMode" (ngModelChange)="shippingModeChange.emit($event)" />
      <label class="form-check-label">Any</label>
    </div>
    <div class="form-check">
      <input type="radio" name="mode" class="form-check-input" value="Air" [(ngModel)]="shippingMode" (ngModelChange)="shippingModeChange.emit($event)" />
      <label class="form-check-label">✈️ Air</label>
    </div>
    <div class="form-check">
      <input type="radio" name="mode" class="form-check-input" value="Sea" [(ngModel)]="shippingMode" (ngModelChange)="shippingModeChange.emit($event)" />
      <label class="form-check-label">🚢 Sea</label>
    </div>
  </div>
</div>
