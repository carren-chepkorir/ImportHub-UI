<div
  class="wishlist-sidebar position-fixed top-0 end-0 bg-light shadow h-100 p-4"
  [class.show]="isOpen"
  style="width: 360px; z-index: 1055;"
>
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
    <h5 class="fw-bold mb-0 text-dark">❤️ My Wishlist</h5>
    <button class="btn btn-sm btn-outline-secondary" (click)="closeSidebar()" aria-label="Close">
      ✖
    </button>
  </div>

  <!-- Empty State -->
  <div *ngIf="wishlist.length === 0" class="text-center text-muted mt-5">
    <i class="bi bi-heartbreak fs-1 text-danger"></i>
    <p class="mt-2">No items in your wishlist.</p>
  </div>

  <!-- Wishlist Items -->
  <div *ngFor="let item of wishlist" class="wishlist-item d-flex align-items-start mb-4 p-2 rounded bg-white shadow-sm">
    <img
      [src]="item.image"
      alt="{{ item.name }}"
      class="rounded"
      style="width: 60px; height: 60px; object-fit: cover;"
    />
    <div class="ms-3 flex-grow-1">
      <h6 class="fw-semibold text-dark mb-1">{{ item.name }}</h6>
      <p class="mb-1 text-muted small">Price: ${{ item.price }}</p>
      <button class="btn btn-sm btn-outline-danger px-2 py-1" (click)="removeItem(item)">
        <i class="bi bi-trash me-1"></i> Remove
      </button>
    </div>
  </div>
</div>
